server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker and manifests must never be cached long, so updates ship.
    location = /app/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location ~ ^/app/manifest\..*\.webmanifest$ {
        # nginx:alpine's mime.types has no webmanifest entry; set it explicitly.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Content-hashed build assets can be cached aggressively.
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
