<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superherooo</title>
  </head>
  <body>
    <script>
      (function () {
        var appPrefix = '/app';
        var path = window.location.pathname;
        if (path.indexOf(appPrefix + '/') === 0) {
          var target = path.slice(appPrefix.length) + window.location.search + window.location.hash;
          window.sessionStorage.setItem('superherooo_app_redirect', target || '/');
          window.location.replace(appPrefix + '/');
          return;
        }
        window.location.replace('/');
      })();
    </script>
  </body>
</html>
