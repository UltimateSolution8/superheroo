<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Superherooo</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--light-gray); margin: 0; padding: 0; }
    .admin-header {
      background: var(--navy);
      padding: 16px 24px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 { font-size: 1.5rem; margin: 0; color: var(--amber); }
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }
    /* Login Form */
    #loginSection {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    /* Dashboard Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab {
      padding: 12px 24px;
      background: transparent;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
    }
    .tab.active { color: var(--navy); }
    .tab.active::after {
      content: "";
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 2px;
      background: var(--navy);
    }
    /* Tables */
    .table-container {
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow-x: auto;
      padding: 24px;
      display: none;
    }
    .table-container.active { display: block; }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th { background: #f8fafc; color: var(--text-mid); font-weight: 600; }
    td { color: var(--text-dark); }
    .badge {
      padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600;
      background: #e2e8f0; color: #475569;
    }
    .badge.active { background: #d1fae5; color: #065f46; }
    .badge.pending { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div class="admin-header">
    <h1>Superherooo Admin</h1>
    <button id="logoutBtn" class="btn btn-amber" style="display: none;" onclick="logout()">Logout</button>
  </div>

  <div class="admin-container">
    <!-- Login Section -->
    <div id="loginSection">
      <h2 style="color: var(--navy); margin-bottom: 24px; text-align: center;">Admin Login</h2>
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="adminEmail" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPassword" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-navy btn-full" id="loginBtn">Login</button>
        <p id="loginError" style="color: #ef4444; margin-top: 12px; text-align: center; display: none;"></p>
      </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" style="display: none;">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('users')">Customers</button>
        <button class="tab" onclick="switchTab('heroes')">Superheroes</button>
        <button class="tab" onclick="switchTab('contacts')">Contact Messages</button>
      </div>

      <!-- Users Table -->
      <div id="usersTab" class="table-container active">
        <div class="table-header">
          <h2>Customers List</h2>
          <button class="btn btn-navy" onclick="downloadCSV('users')">Download CSV</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Status</th><th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="usersBody"><tr><td colspan="6" style="text-align: center;">Loading...</td></tr></tbody>
        </table>
      </div>

      <!-- Heroes Table -->
      <div id="heroesTab" class="table-container">
        <div class="table-header">
          <h2>Superheroes List</h2>
          <button class="btn btn-navy" onclick="downloadCSV('heroes')">Download CSV</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Mobile</th><th>Primary Service</th><th>City</th><th>Profile Status</th><th>Joined Date</th>
            </tr>
          </thead>
          <tbody id="heroesBody"><tr><td colspan="7" style="text-align: center;">Loading...</td></tr></tbody>
        </table>
      </div>

      <!-- Contacts Table -->
      <div id="contactsTab" class="table-container">
        <div class="table-header">
          <h2>Contact Messages</h2>
          <button class="btn btn-navy" onclick="downloadCSV('contacts')">Download CSV</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th>
            </tr>
          </thead>
          <tbody id="contactsBody"><tr><td colspan="5" style="text-align: center;">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://142-93-208-120.sslip.io/api/admin';
    let adminToken = localStorage.getItem('sh_admin_token');
    
    // Data stores for CSV export
    const dataStore = { users: [], heroes: [], contacts: [] };

    document.addEventListener("DOMContentLoaded", () => {
      if (adminToken) {
        showDashboard();
      }
    });

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');

      btn.disabled = true; btn.innerText = 'Logging in...'; err.style.display = 'none';
      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          adminToken = data.token;
          localStorage.setItem('sh_admin_token', adminToken);
          showDashboard();
        } else {
          err.innerText = data.message; err.style.display = 'block';
        }
      } catch (error) {
        err.innerText = 'Network error.'; err.style.display = 'block';
      }
      btn.disabled = false; btn.innerText = 'Login';
    });

    function logout() {
      localStorage.removeItem('sh_admin_token');
      adminToken = null;
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
    }

    function showDashboard() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'block';
      fetchData('users');
      fetchData('heroes');
      fetchData('contacts');
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.table-container').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`${tabName}Tab`).classList.add('active');
    }

    async function fetchData(type) {
      try {
        const res = await fetch(`${API_BASE}/${type}`, {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        if (res.status === 401) { logout(); return; }
        const data = await res.json();
        if (data.success) {
          dataStore[type] = data.data;
          renderTable(type, data.data);
        }
      } catch (err) {
        console.error(`Error fetching ${type}:`, err);
      }
    }

    function renderTable(type, items) {
      const tbody = document.getElementById(`${type}Body`);
      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No data found.</td></tr>`;
        return;
      }
      
      tbody.innerHTML = items.map(item => {
        if (type === 'users') {
          return `<tr>
            <td>${item.id}</td><td>${item.full_name}</td><td>${item.email}</td><td>${item.mobile}</td>
            <td><span class="badge ${item.is_active ? 'active' : ''}">${item.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>${new Date(item.created_at).toLocaleDateString()}</td>
          </tr>`;
        } else if (type === 'heroes') {
          return `<tr>
            <td>${item.id}</td><td>${item.full_name}</td><td>${item.mobile}</td>
            <td>${item.primary_service}</td><td>${item.city}</td>
            <td><span class="badge ${item.profile_status === 'approved' ? 'active' : 'pending'}">${item.profile_status.toUpperCase()}</span></td>
            <td>${new Date(item.created_at).toLocaleDateString()}</td>
          </tr>`;
        } else if (type === 'contacts') {
          return `<tr>
            <td>${new Date(item.created_at).toLocaleString()}</td>
            <td>${item.name}</td><td>${item.email}</td><td>${item.subject || '-'}</td>
            <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.message}</td>
          </tr>`;
        }
      }).join('');
    }

    function downloadCSV(type) {
      const items = dataStore[type];
      if (!items || items.length === 0) {
        alert("No data available to download.");
        return;
      }

      // Get headers from first object
      const headers = Object.keys(items[0]);
      let csvContent = headers.join(',') + '\n';
      
      items.forEach(row => {
        let values = headers.map(header => {
          let val = row[header];
          if (val === null || val === undefined) val = '';
          val = String(val).replace(/"/g, '""');
          return `"${val}"`;
        });
        csvContent += values.join(',') + '\n';
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `superherooo_${type}_export.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
